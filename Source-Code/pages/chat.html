<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Obrolan - Komunikasi Web</title>

  <link
    rel="stylesheet"
    href="../css/global.css"
  >

  <link
    rel="stylesheet"
    href="../css/chat.css"
  >
</head>

<body>

  <!-- =========================
       TOP BAR
       ========================= -->

  <header class="topbar">

    <div class="brand">
      Komunikasi
    </div>

    <input
      id="searchChat"
      type="search"
      placeholder="Search chat"
      aria-label="Cari chat"
    >

    <button
      class="btn"
      type="button"
      aria-label="Tambah"
    >
      +
    </button>

  </header>


  <!-- =========================
       MAIN
       ========================= -->

  <main class="container">

    <!-- LIST VIEW -->

    <section
      id="list-view"
      class="card"
      style="
        padding: 0;
        overflow: hidden;
      "
    >

      <div id="conversationList"></div>

      <div
        id="emptyState"
        style="
          display: none;
          padding: 24px;
          text-align: center;
          color: var(--muted);
        "
      >
        Belum ada percakapan.
      </div>

      <div
        id="loadingState"
        style="
          padding: 24px;
          text-align: center;
          color: var(--muted);
        "
      >
        Memuat...
      </div>

    </section>


    <!-- CHAT VIEW -->

    <section
      id="chat-view"
      class="card"
      style="
        display: none;
        padding: 0;
        min-height: 70vh;
        overflow: hidden;
      "
    >

      <header class="chat-header">

        <a
          id="backBtn"
          href="./chat.html"
          class="btn"
          aria-label="Kembali"
        >
          ←
        </a>

        <span id="chat-title">
          Chat
        </span>

      </header>


      <div
        id="messageList"
      ></div>


      <div class="input-area">

        <textarea
          id="msgInput"
          placeholder="Ketik pesan..."
          rows="1"
          aria-label="Ketik pesan"
        ></textarea>

        <button
          id="sendBtn"
          class="btn"
          type="button"
        >
          Kirim
        </button>

      </div>

    </section>

  </main>


  <!-- =========================
       BOTTOM NAVIGATION
       ========================= -->

  <nav class="bottom-nav">

    <a
      href="./chat.html"
      class="active"
    >
      Obrolan
    </a>

    <a href="./status.html">
      Status
    </a>

    <a href="./search.html">
      Pencarian
    </a>

    <a href="./profile.html">
      Profile
    </a>

  </nav>


  <!-- =========================
       JAVASCRIPT
       ========================= -->

  <script type="module">

    import "../js/theme.js";

    import {
      checkSession
    } from "../js/auth.js";

    import {
      loadConversations,
      loadMessages,
      sendMessage
    } from "../js/chat.js";

    import {
      unsubscribeMessages
    } from "../js/realtime.js";


    const session =
      await checkSession(true);


    if (!session) {
      throw new Error(
        "User belum login."
      );
    }


    const params =
      new URLSearchParams(
        window.location.search
      );

    const convId =
      params.get("id");


    if (convId) {

      await loadMessages(
        convId
      );


      const input =
        document.getElementById(
          "msgInput"
        );

      const sendButton =
        document.getElementById(
          "sendBtn"
        );

      const backButton =
        document.getElementById(
          "backBtn"
        );


      const send =
        async () => {

          const content =
            input.value.trim();


          if (!content) {
            return;
          }


          sendButton.disabled =
            true;


          const result =
            await sendMessage(
              convId,
              content
            );


          sendButton.disabled =
            false;


          if (
            result?.success
          ) {

            input.value =
              "";

            input.focus();

          }

        };


      sendButton.addEventListener(
        "click",
        send
      );


      input.addEventListener(
        "keydown",
        (event) => {

          if (
            event.key === "Enter" &&
            !event.shiftKey
          ) {

            event.preventDefault();

            send();

          }

        }
      );


      backButton.addEventListener(
        "click",
        () => {

          unsubscribeMessages();

        }
      );

    } else {

      await loadConversations();

    }


    window.addEventListener(
      "beforeunload",
      unsubscribeMessages
    );

  </script>

</body>

</html>
