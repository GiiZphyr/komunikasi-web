<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Obrolan - Komunikasi Web</title>

  <link
    rel="stylesheet"
    href="../css/global.css"
  >

  <link
    rel="stylesheet"
    href="../css/chat.css"
  >
</head>

<body>

  <header class="topbar">
    <div class="brand">
      Komunikasi
    </div>

    <input
      type="search"
      placeholder="Search chat"
      aria-label="Cari chat"
    >

    <button
      class="btn"
      type="button"
      aria-label="Tambah"
    >
      +
    </button>
  </header>

  <main class="container">
    <div
      class="card"
      style="padding: 0; overflow: hidden;"
    >

      <div class="list-item">
        <div class="avatar"></div>

        <div>
          <div style="font-weight: 700;">
            Preview Chat
          </div>

          <div
            style="
              color: var(--muted);
              font-size: 13px;
            "
          >
            Halo, ini layout PHASE 5
          </div>
        </div>

        <div
          style="
            margin-left: auto;
            color: var(--muted);
            font-size: 12px;
          "
        >
          10:30
        </div>
      </div>

      <div class="list-item">
        <div class="avatar"></div>

        <div>
          <div style="font-weight: 700;">
            Grup Keluarga
          </div>

          <div
            style="
              color: var(--muted);
              font-size: 13px;
            "
          >
            Preview pesan terakhir...
          </div>
        </div>

        <div
          style="
            margin-left: auto;
            color: var(--muted);
            font-size: 12px;
          "
        >
          09:12
        </div>
      </div>

    </div>
  </main>

  <nav class="bottom-nav">
    <a
      href="./chat.html"
      class="active"
    >
      Obrolan
    </a>

    <a href="./status.html">
      Status
    </a>

    <a href="./search.html">
      Pencarian
    </a>

    <a href="./profile.html">
      Profile
    </a>
  </nav>

  <script type="module">
    import "../js/theme.js";

    import {
      checkSession
    } from "../js/auth.js";

    await checkSession(true);
  </script>

</body>
</html>
