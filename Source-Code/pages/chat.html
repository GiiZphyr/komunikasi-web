<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Obrolan</title>

  <link
    rel="stylesheet"
    href="../css/global.css"
  >

  <link
    rel="stylesheet"
    href="../css/chat.css"
  >
</head>

<body>

  <!-- =====================================================
       TOPBAR
       ===================================================== -->

  <div class="topbar">
    <div class="brand">
      Komunikasi
    </div>

    <input
      id="searchChat"
      type="search"
      placeholder="Search chat"
    >

    <button
      class="btn"
      type="button"
    >
      +
    </button>
  </div>


  <!-- =====================================================
       MAIN CONTAINER
       ===================================================== -->

  <div class="container">

    <!-- ===================================================
         CONVERSATION LIST
         =================================================== -->

    <div
      id="list-view"
      class="card"
      style="padding:0;overflow:hidden"
    >

      <div id="conversationList"></div>

      <div
        id="emptyState"
        class="chat-empty"
        style="display:none"
      >
        Belum ada percakapan
      </div>

      <div
        id="loadingState"
        class="chat-empty"
      >
        Memuat...
      </div>

    </div>


    <!-- ===================================================
         CHAT VIEW
         =================================================== -->

    <div
      id="chat-view"
      class="card"
      style="
        display:none;
        padding:0;
        min-height:70vh;
        flex-direction:column;
      "
    >

      <!-- ===============================================
           CHAT HEADER
           =============================================== -->

      <div class="chat-header">

        <a
          id="backBtn"
          href="./chat.html"
          class="btn"
        >
          ←
        </a>

        <div class="chat-header-info">

          <div
            id="chat-title"
            class="chat-title"
          >
            Chat
          </div>

          <div
            id="realtimeStatus"
            class="realtime-status"
          >
            Menghubungkan...
          </div>

        </div>

      </div>


      <!-- ===============================================
           MESSAGE LIST
           =============================================== -->

      <div
        id="messageList"
        class="message-list"
      ></div>


      <!-- ===============================================
           MESSAGE INPUT
           =============================================== -->

      <div class="input-area">

        <textarea
          id="msgInput"
          placeholder="Ketik pesan..."
          rows="1"
        ></textarea>

        <button
          id="sendBtn"
          class="btn"
          type="button"
        >
          Kirim
        </button>

      </div>

    </div>

  </div>


  <!-- =====================================================
       BOTTOM NAVIGATION
       ===================================================== -->

  <nav class="bottom-nav">

    <a
      href="./chat.html"
      class="active"
    >
      Obrolan
    </a>

    <a href="./status.html">
      Status
    </a>

    <a href="./search.html">
      Pencarian
    </a>

    <a href="./profile.html">
      Profile
    </a>

  </nav>


  <!-- =====================================================
       MODULE SCRIPT
       ===================================================== -->

  <script type="module">

    import "../js/theme.js";

    import {
      checkSession
    } from "../js/auth.js";

    import {
      loadConversations,
      loadMessages,
      sendMessage
    } from "../js/chat.js";

    import {
      unsubscribeMessages
    } from "../js/realtime.js";


    /* =====================================================
       SESSION
       ===================================================== */

    await checkSession(true);


    /* =====================================================
       GET CONVERSATION ID
       ===================================================== */

    const params =
      new URLSearchParams(
        window.location.search
      );

    const convId =
      params.get("id");


    /* =====================================================
       CHAT MODE
       ===================================================== */

    if (convId) {

      const input =
        document.getElementById(
          "msgInput"
        );

      const sendButton =
        document.getElementById(
          "sendBtn"
        );


      /* ================================================
         SEND FUNCTION
         ================================================ */

      const send = async () => {

        const value =
          input.value.trim();

        if (!value) {
          return;
        }

        const result =
          await sendMessage(
            convId,
            value
          );

        if (
          result?.success
        ) {
          input.value = "";
          input.focus();
        }

      };


      /* ================================================
         BUTTON
         ================================================ */

      sendButton.addEventListener(
        "click",
        send
      );


      /* ================================================
         ENTER
         ================================================ */

      input.addEventListener(
        "keydown",
        (event) => {

          if (
            event.key === "Enter" &&
            !event.shiftKey
          ) {

            event.preventDefault();

            send();
          }

        }
      );


      /* ================================================
         BACK BUTTON
         ================================================ */

      document
        .getElementById("backBtn")
        .addEventListener(
          "click",
          () => {
            unsubscribeMessages();
          }
        );


      /* ================================================
         LOAD CHAT
         ================================================ */

      await loadMessages(
        convId
      );

    } else {

      /* ================================================
         LOAD CONVERSATION LIST
         ================================================ */

      await loadConversations();

    }


    /* =====================================================
       PAGE CLEANUP
       ===================================================== */

    window.addEventListener(
      "beforeunload",
      () => {
        unsubscribeMessages();
      }
    );

  </script>

</body>

</html>
