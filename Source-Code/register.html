<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Daftar - Komunikasi Web</title>

  <link rel="stylesheet" href="./css/global.css">
  <link rel="stylesheet" href="./css/auth.css">
</head>

<body>
  <div
    class="container"
    style="max-width: 420px"
  >
    <div class="card">
      <h2>Buat Akun</h2>

      <p>Daftar untuk mulai menggunakan Komunikasi Web.</p>

      <input
        id="email"
        type="email"
        placeholder="Email"
        autocomplete="email"
      >

      <br><br>

      <input
        id="pass"
        type="password"
        placeholder="Password"
        autocomplete="new-password"
      >

      <br><br>

      <button
        id="registerBtn"
        class="btn"
        type="button"
        style="width: 100%"
      >
        Daftar
      </button>

      <p>
        Sudah punya akun?
        <a
          href="./login.html"
          style="color: var(--steel); font-weight: 700"
        >
          Login
        </a>
      </p>
    </div>
  </div>

  <script type="module">
    import {
      signUp,
      checkSession
    } from "./js/auth.js";

    await checkSession(false);

    document
      .getElementById("registerBtn")
      .addEventListener("click", async () => {
        const email = document
          .getElementById("email")
          .value
          .trim();

        const password = document
          .getElementById("pass")
          .value;

        if (!email || !password) {
          alert("Email dan password wajib diisi.");
          return;
        }

        if (password.length < 6) {
          alert("Password minimal 6 karakter.");
          return;
        }

        await signUp(email, password);
      });
  </script>
</body>
</html>
