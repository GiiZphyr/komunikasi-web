<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Komunikasi Web</title>

  <link rel="stylesheet" href="./css/global.css">
</head>

<body>
  <div class="container">
    <div class="card">
      <h2>Loading...</h2>

      <p id="msg">
        Mengecek sesi pengguna...
      </p>
    </div>
  </div>

  <script type="module">
    import { supabase } from "./js/supabase.js";

    const msg = document.getElementById("msg");

    if (!supabase) {
      msg.textContent =
        "PHASE 2 OK - Supabase belum dikonfigurasi.";

      setTimeout(() => {
        location.href = "./login.html";
      }, 800);
    } else {
      const {
        data: { session }
      } = await supabase.auth.getSession();

      location.href = session
        ? "./pages/chat.html"
        : "./login.html";
    }
  </script>
</body>
</html>
