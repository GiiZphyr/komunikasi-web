<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Login - Komunikasi Web</title>

  <link rel="stylesheet" href="./css/global.css">
  <link rel="stylesheet" href="./css/auth.css">
</head>
<body class="auth-page">
  <div
    class="container"
    style="max-width: 420px"
  >
    <div class="card">
      <h2>Masuk</h2>

      <input
        id="email"
        type="email"
        placeholder="Email"
      >

      <br><br>

      <input
        id="pass"
        type="password"
        placeholder="Password"
      >

      <br><br>

      <button
        id="loginBtn"
        class="btn"
        type="button"
        style="width: 100%">
          Login
      </button>

      <p>
        Belum punya akun?
        <a
          href="./register.html"
          style="color: var(--steel); font-weight: 700"
        >
          Daftar
        </a>
      </p>

      <p>
        <a href="./pages/chat.html">
          → Lihat layout chat (tanpa login)
        </a>
      </p>
    </div>
  </div>
  <script type="module">
    import {
      signIn,
      checkSession
    } from "./js/auth.js";

    await checkSession(false);

    document
      .getElementById("loginBtn")
      .addEventListener("click", async () => {
        const email = document
          .getElementById("email")
          .value
          .trim();

        const password = document
          .getElementById("pass")
          .value;

        if (!email || !password) {
          alert("Email dan password wajib diisi.");
          return;
        }

        await signIn(email, password);
      });
  </script>
</body>
</html>
